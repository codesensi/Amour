plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'cn.codesensi'
version = '0.0.1-SNAPSHOT'
description = 'Amour'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    // JDBC + HikariCP 数据源（Spring Boot 4 需显式引入才具备 DataSource/Hikari 自动配置）
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // H2 Web 控制台自动配置（Spring Boot 4 拆分出的独立模块，需显式引入）
    implementation 'org.springframework.boot:spring-boot-h2console'
    // MyBatis-Flex ORM（Spring Boot 4 专用 starter）
    implementation 'com.mybatis-flex:mybatis-flex-spring-boot4-starter:1.11.8'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation("org.lionsoul:ip2region:3.3.7")
    implementation("org.zalando:logbook-spring-boot-starter:4.1.0")
}

tasks.named('test') {
    useJUnitPlatform()
}
