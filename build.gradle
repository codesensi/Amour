// ===== 插件相关 =====
plugins {
    // Java 基础插件：提供编译、打包（jar）、测试等标准任务（Gradle 内建，无版本）
    id 'java'
    // Spring Boot 插件：管理可执行 jar 的打包与 Spring Boot 启动（版本由 libs.versions.toml 管理）
    alias libs.plugins.spring.boot
}

// ===== 项目基本信息 =====
group = 'cn.codesensi'          // Maven 坐标的 group（包名基础）
version = '0.0.1-SNAPSHOT'      // 项目版本（SNAPSHOT 表示开发中版本）
description = 'Amour'           // 项目描述

// ===== Java 工具链（编译/运行所需的 JDK 版本） =====
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)  // 使用 JDK 21
    }
}

// ===== 依赖仓库：从 Maven 中央仓库拉取依赖 =====
repositories {
    mavenCentral()
}

// ===== 依赖声明 =====
// 排序规则：按依赖作用域（scope）分组；组内按依赖坐标字母序排列，便于快速定位与维护。
// 所有依赖坐标与版本号统一在 gradle/libs.versions.toml 中管理，这里仅通过 libs.xxx 引用。
dependencies {
    // Spring Boot BOM：统一管理 Spring 系组件（starter、caffeine、h2、lombok、junit 等）版本。
    // Gradle 的 platform() 版本约束仅作用于声明它的配置，而 lombok/h2/junit 等 BOM 组件分布在
    // compileOnly/annotationProcessor/runtimeOnly/test* 等不同配置，因此需为每个相关配置都引入该 BOM，
    // 否则这些配置里的组件会因缺少版本而无法解析。
    implementation platform(libs.spring.boot.dependencies)
    compileOnly platform(libs.spring.boot.dependencies)
    annotationProcessor platform(libs.spring.boot.dependencies)
    runtimeOnly platform(libs.spring.boot.dependencies)
    testImplementation platform(libs.spring.boot.dependencies)
    testCompileOnly platform(libs.spring.boot.dependencies)
    testAnnotationProcessor platform(libs.spring.boot.dependencies)
    testRuntimeOnly platform(libs.spring.boot.dependencies)

    // ---------- 实现期依赖（implementation）：编译 + 运行都需要 ----------
    // Spring Boot 相关
    implementation libs.spring.boot.starter.cache    // Spring Cache 抽象
    implementation libs.spring.boot.starter.jdbc     // JDBC + HikariCP 数据源（Spring Boot 4 需显式引入才具备自动配置）
    implementation libs.spring.boot.starter.webmvc   // Spring Web（MVC）Starter：提供 Web 开发能力
    implementation libs.spring.boot.h2console        // H2 Web 控制台自动配置
    // 第三方框架 / 库（按坐标字母序）
    implementation libs.caffeine                    // Caffeine 本地缓存实现
    implementation libs.mybatis.flex.starter         // MyBatis-Flex ORM
    implementation libs.mapstruct                    // MapStruct：编译期生成 Bean 映射代码
    implementation libs.ip2region                    // 工具库：IP 归属地查询
    implementation libs.logbook.starter              // 日志：HTTP 请求/响应日志

    // ---------- 编译期依赖（compileOnly）：仅编译时需要，不打入最终产物 ----------
    compileOnly libs.lombok                          // Lombok：编译期生成 getter/setter 等样板代码

    // ---------- 注解处理器（annotationProcessor）：编译期参与代码生成 ----------
    annotationProcessor libs.lombok                  // Lombok 注解处理器
    annotationProcessor libs.mapstruct.processor     // MapStruct 注解处理器（扫描 @Mapper 生成实现类）
    annotationProcessor libs.mybatis.flex.processor  // MyBatis-Flex 注解处理器（生成 TableDef 等查询常量）

    // ---------- 运行期依赖（runtimeOnly）：仅运行时需要 ----------
    runtimeOnly libs.h2                               // H2 内存数据库

    // ---------- 测试依赖（test*）：仅测试场景使用 ----------
    testImplementation libs.spring.boot.starter.webmvc.test  // Web 测试 Starter
    testCompileOnly libs.lombok                       // 测试期 Lombok 依赖
    testAnnotationProcessor libs.lombok               // 测试期 Lombok 注解处理器
    testRuntimeOnly libs.junit.platform.launcher      // JUnit Platform 启动器
}

// ===== 测试任务配置 =====
tasks.named('test') {
    useJUnitPlatform()  // 使用 JUnit Platform（JUnit 5）运行测试
}
