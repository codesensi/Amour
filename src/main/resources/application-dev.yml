spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # H2 文件数据库
    driver-class-name: org.h2.Driver
    url: jdbc:h2:./data/amour_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    # HikariCP 连接池
    hikari:
      # 客户端从连接池等待连接的最大毫秒数
      connection-timeout: 20000
      # 连接池中维护的最小空闲连接数
      minimum-idle: 10
      # 最大连接池数大小
      maximum-pool-size: 50
      # 允许一个连接在连接池中闲置的最大毫秒数
      idle-timeout: 300000
      # 池中连接关闭后的最长生存毫秒数
      max-lifetime: 1200000
      # 从池中返回的连接的默认自动提交行为
      auto-commit: true
  # 启动时执行初始化脚本：先建表（schema），再填充数据（data）
  sql:
    init:
      # 每次启动都执行
      mode: always
      # 建表脚本
      schema-locations: classpath:sql/init_ddl.sql
      # 数据填充脚本
      data-locations: classpath:sql/init_dml.sql
      # 执行失败立即报错终止启动
      continue-on-error: false
  # H2 Web 控制台（仅 dev 环境开启）
  h2:
    console:
      enabled: true
      # 访问路径：http://localhost:9666/h2-console
      path: /h2-console
      # 允许后台以 iframe 方式嵌入控制台
      settings:
        web-allow-others: true
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=1000,recordStats
