spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # H2 文件数据库
    driver-class-name: org.h2.Driver
    url: jdbc:h2:./data/amour_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    # HikariCP 连接池
    hikari:
      # 客户端从连接池等待连接的最大毫秒数
      connection-timeout: 20000
      # 连接池中维护的最小空闲连接数
      minimum-idle: 10
      # 最大连接池数大小
      maximum-pool-size: 50
      # 允许一个连接在连接池中闲置的最大毫秒数
      idle-timeout: 300000
      # 池中连接关闭后的最长生存毫秒数
      max-lifetime: 1200000
      # 从池中返回的连接的默认自动提交行为
      auto-commit: true
  # 启动时执行初始化脚本：先建表（schema），再填充数据（data）
  sql:
    init:
      # 每次启动都执行
      mode: always
      # 建表脚本
      schema-locations: classpath:sql/init_ddl.sql
      # 数据填充脚本
      data-locations: classpath:sql/init_dml.sql
      # 执行失败立即报错终止启动
      continue-on-error: false
  # H2 Web 控制台（仅 dev 环境开启）
  h2:
    console:
      enabled: true
      # 访问路径：http://localhost:9666/h2-console
      path: /h2-console
      # 允许后台以 iframe 方式嵌入控制台
      settings:
        web-allow-others: true
  cache:
    type: caffeine
  # Thymeleaf 模板：开发环境关闭缓存，修改模板后刷新即生效，无需重启
  thymeleaf:
    cache: false

# 日志级别配置
logging:
  level:
    cn.codesensi.amour: trace

# Logbook配置（dev 覆盖）
logbook:
  filter:
    # 表单请求体处理模式：PARAMETER = 先解析 Servlet 参数、再从参数重建表单体。
    # 修复 H2 控制台（form POST）请求体被 Logbook 以 BODY 模式提前消费、
    # 导致表单参数丢失而报 "No suitable driver found for 08001/0" 的问题
    form-request-mode: PARAMETER

# 自定义缓存配置（单位：秒）
app:
  # 演示模式开关
  demo-mode: false
  # caches 中 name 为基础缓存名，实际注册时会自动拼接「项目名_运行环境」前缀（见 CacheUtil）
  cache:
    max-size: 1000
    caches:
      - name: captcha
        expire-after-write: 300
        expire-after-access: 0
      - name: config
        # 驻留不自动过期，热更新依赖写库侧调用 ConfigService.evictCache 失效
        expire-after-write: 2592000
        expire-after-access: 0
      - name: role
        # 角色编码缓存：写后 30 天兜底过期，写侧显式失效（分配角色、角色变更/删除时清除）
        expire-after-write: 2592000
        expire-after-access: 0
      - name: perm
        # 权限编码缓存：写后 30 天兜底过期，写侧显式失效（分配角色、分配菜单、角色变更/删除时清除）
        expire-after-write: 2592000
        expire-after-access: 0
      - name: menu
        # 路由菜单缓存：写后 30 天兜底过期，写侧显式失效（分配角色/菜单、菜单与角色变更时清除）
        expire-after-write: 2592000
        expire-after-access: 0
      - name: user
        # 用户信息缓存：写后 30 天兜底过期，写侧显式失效（资料/角色/权限/菜单任一变更时清除）
        expire-after-write: 2592000
        expire-after-access: 0
  # 安全配置
  security:
    # 请求缓存限制 5M
    request-cache-limit: 5242880

# sa-token配置
sa-token:
  # 是否输出操作日志
  is-log: true
  # jwt秘钥
  jwt-secret-key: f3c55ed9e4f54edfa8867f904aef6742
