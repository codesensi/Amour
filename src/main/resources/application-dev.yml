spring:
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # H2 文件数据库
    driver-class-name: org.h2.Driver
    url: jdbc:h2:./data/amour_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    # HikariCP 连接池
    hikari:
      # 客户端从连接池等待连接的最大毫秒数
      connection-timeout: 20000
      # 连接池中维护的最小空闲连接数
      minimum-idle: 10
      # 最大连接池数大小
      maximum-pool-size: 50
      # 允许一个连接在连接池中闲置的最大毫秒数
      idle-timeout: 300000
      # 池中连接关闭后的最长生存毫秒数
      max-lifetime: 1200000
      # 从池中返回的连接的默认自动提交行为
      auto-commit: true
  # 启动时执行初始化脚本：先建表（schema），再填充数据（data）
  sql:
    init:
      # 每次启动都执行
      mode: always
      # 建表脚本
      schema-locations: classpath:sql/init_ddl.sql
      # 数据填充脚本
      data-locations: classpath:sql/init_dml.sql
      # 执行失败立即报错终止启动
      continue-on-error: false
  # H2 Web 控制台（仅 dev 环境开启）
  h2:
    console:
      enabled: true
      # 访问路径：http://localhost:9666/h2-console
      path: /h2-console
      # 允许后台以 iframe 方式嵌入控制台
      settings:
        web-allow-others: true
  cache:
    type: caffeine
  # Thymeleaf 模板：开发环境关闭缓存，修改模板后刷新即生效，无需重启
  thymeleaf:
    cache: false
  # 文件上传全局限制(单文件业务上限另由 FileBizTypeEnum 按业务类型控制)
  servlet:
    multipart:
      # 单个文件允许的最大大小
      max-file-size: 50MB
      # 整个 multipart 请求允许的最大大小
      max-request-size: 500MB

# 日志级别配置
logging:
  level:
    cn.codesensi.amour: trace

# Logbook配置（dev 覆盖）
logbook:
  filter:
    # 表单请求体处理模式：PARAMETER = 先解析 Servlet 参数、再从参数重建表单体。
    # 修复 H2 控制台（form POST）请求体被 Logbook 以 BODY 模式提前消费、
    # 导致表单参数丢失而报 "No suitable driver found for 08001/0" 的问题
    form-request-mode: PARAMETER

# 自定义缓存配置（单位：秒）
app:
  # 演示模式开关
  demo-mode: false
  # caches 中 name 为基础缓存名，实际注册时会自动拼接「项目名_运行环境」前缀（见 CacheUtil）
  cache:
    max-size: 1000
    # 过期时间随机抖动幅度（百分比，10 = 基准值上下 ±10% 内随机），0 表示关闭；
    # 用于避免多个缓存（如同批预热的条目）在同一时点集中过期
    expire-jitter-percent: 10
    # 参与抖动的最小过期时间（秒），短 TTL 缓存（验证码、QQ 信息）保持精确语义
    expire-jitter-min-seconds: 86400
    caches:
      - name: captcha
        expire-after-write: 300
        expire-after-access: 0
      - name: config
        # 配置缓存：写后 30 天左右兜底过期，热更新依赖写库侧调用 ConfigService.evictCache 失效
        expire-after-write: 2592000
        expire-after-access: 0
      - name: role
        # 角色编码缓存：写后 30 天左右兜底过期，写侧显式失效（分配角色、角色变更/删除时清除）
        expire-after-write: 2592000
        expire-after-access: 0
      - name: perm
        # 权限编码缓存：写后 30 天左右兜底过期，写侧显式失效（分配角色、分配菜单、角色变更/删除时清除）
        expire-after-write: 2592000
        expire-after-access: 0
      - name: menu
        # 路由菜单缓存：写后 30 天左右兜底过期，写侧显式失效（分配角色/菜单、菜单与角色变更时清除）
        expire-after-write: 2592000
        expire-after-access: 0
      - name: user
        # 用户信息缓存：写后 30 天左右兜底过期，写侧显式失效（资料/角色/权限/菜单任一变更时清除）
        expire-after-write: 2592000
        expire-after-access: 0
      - name: qq
        # QQ 信息缓存：写后 15 分钟过期，同一 QQ 号短时复用，避免失焦/翻页的高频调用穿透上游
        expire-after-write: 900
        expire-after-access: 0
      - name: dict
        # 数据字典缓存：Key 为字典编码（dict_code），写后 30 天左右兜底过期，写侧显式失效（字典增删改时清除对应编码）
        expire-after-write: 2592000
        expire-after-access: 0
  # 文件存储配置(存储方式运行时以 sys_config 的 file.storage 为准,此处为配置缺失时的兜底值)
  file:
    storage: local
    local:
      # 本地存储根目录,实际文件按 {bizType}/{yyyyMM}/{fileId}.{ext} 落盘
      base-path: ./data/files
    # 对象存储参数(OSS 接入时启用)
    oss:
      endpoint:
      bucket:
      access-key:
      secret-key:

# sa-token配置
sa-token:
  # 是否输出操作日志
  is-log: true
  # jwt秘钥
  jwt-secret-key: f3c55ed9e4f54edfa8867f904aef6742

# 线程池配置
thread:
  pool:
    # ---- 通用池:承载操作日志之外的其他异步任务,饱和时反压,任务不丢 ----
    general:
      # 是否启用虚拟线程(Java 21):启用后 core/queue/keepAlive 不生效,仅 max-pool-size 作为并发上限
      virtual-threads: true
      # 设置核心线程数
      core-pool-size: 5
      # 设置最大线程数(虚拟线程模式下复用为并发上限)
      max-pool-size: 20
      # 设置缓冲队列大小
      queue-capacity: 100
      # 设置线程的最大空闲秒数
      keep-alive-seconds: 30
      # 是否允许核心线程超时
      allow-core-thread-timeout: true
      # 是否等待剩余任务完成后才关闭应用
      wait-for-tasks-to-complete-on-shutdown: true
      # 等待剩余任务完成的最大秒数
      await-termination-seconds: 5
      # 拒绝策略
      rejected-execution-handler: CallerRunsWarnPolicy
    # ---- 日志池:操作日志落库专用,队列饱和即丢弃并告警,绝不反压业务线程 ----
    log:
      core-pool-size: 1
      max-pool-size: 2
      queue-capacity: 200
      keep-alive-seconds: 60
      allow-core-thread-timeout: false
      wait-for-tasks-to-complete-on-shutdown: true
      await-termination-seconds: 5
      rejected-execution-handler: DiscardWarnPolicy
