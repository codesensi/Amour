server:
  port: 9666
  # 开启优雅停机
  shutdown: graceful

spring:
  application:
    name: amour
  lifecycle:
    # 优雅停机最大等待时间
    timeout-per-shutdown-phase: 60s
  profiles:
    active: dev

# 日志配置（含 logback 滚动策略）
logging:
  pattern:
    dateformat: yyyy-MM-dd HH:mm:ss.SSS
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:%5p}) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%t]){faint} [${spring.profiles.active}] [%X{traceId:-}] %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n'
    file: '%d{yyyy-MM-dd HH:mm:ss.SSS} ${LOG_LEVEL_PATTERN:%5p} ${PID:- } --- [%t] [${spring.profiles.active}] [%X{traceId:-}] %-40.40logger{39} : %m%n'
  file:
    name: ./logs/${spring.application.name}_${spring.profiles.active}.log
  logback:
    rollingpolicy:
      file-name-pattern: ${logging.file.name}.%d.%i.log
      max-file-size: 100MB
      max-history: 180
  level:
    org.zalando.logbook.Logbook: TRACE

# mybatis-flex配置
mybatis-flex:
  global-config:
    key-config:
      key-type: generator
      value: snowFlakeId
    logic-delete-column: del_flag

# Logbook配置
logbook:
  write:
    # body 最大记录长度，超出部分用 ... 截断
    max-body-size: 2000
  obfuscate:
    # 混淆内容替换字符串
    replacement: "***"
    # 需要混淆的 HTTP Header 名称列表
    headers:
      - Authorization
      - cookie
      - Set-Cookie
    # 需要混淆的 JSON Body 字段名称列表
    json-body-fields:
      - accessToken
      - password
      - oldPassword
      - newPassword
      - confirmPassword

# sa-token配置
sa-token:
  # token前缀
  token-prefix: Bearer
  # token 名称（同时也是 cookie 名称）
  token-name: Authorization
  # token 有效期（单位：秒） 默认30天，-1 代表永久有效
  timeout: -1
  # token 最低活跃频率（单位：秒），如果 token 超过此时间没有访问系统就会被冻结，默认-1 代表不限制，永不冻结
  active-timeout: 2592000
  # 是否允许同一账号多地同时登录 （为 true 时允许一起登录, 为 false 时新登录挤掉旧登录）
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个 token （为 true 时所有登录共用一个 token, 为 false 时每次登录新建一个 token）
  is-share: false
  # token 风格（默认可取值：uuid、simple-uuid、random-32、random-64、random-128、tik）
  token-style: random-128

# 应用配置（app 段为全局基座,环境专属覆盖写在 application-{profile}.yml）
app:
  # UApiPro(https://uapis.cn/)接口超时(毫秒)
  uapi-timeout: 5000
  # UApiPro 获取 QQ 信息接口地址模板(%s = URL 编码后的 QQ 号);留空/未配置时 /qq-info 直接降级 qq-avatar;配置文件改动需重启生效
  uapi-qq: https://uapis.cn/api/v1/social/qq/userinfo?qq=%s
  # QQ 官方头像接口地址模板(%s = QQ 号);uapi-qq 失败时的第一级降级;留空/未配置时 /qq-info 响应数据全为空,由前端本地兜底图兜底
  qq-avatar: https://q.qlogo.cn/headimg_dl?dst_uin=%s&spec=640&img_type=jpg
  # UApiPro 获取一言接口地址
  uapi-saying-random: https://uapis.cn/api/v1/saying/random?source=caoxingyu sentence,sentences bundle
  # UApiPro 获取一言(普通版,降级来源)接口地址:响应仅含 text 字段
  uapi-saying: https://uapis.cn/api/v1/saying

