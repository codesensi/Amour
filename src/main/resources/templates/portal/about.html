<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('龙猫の爱恋 — 关于我们')}"></head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: hero}"></div>

<!-- 内容：对话机器人 -->
<div id="pjax-container">
  <h4 class="text-ce central">与 <i>Ki_About</i> 小站对话中...</h4>
  <div class="central central-600">
    <div class="chat-box-wrap">
      <div class="chat-box" id="chat-box"></div>
    </div>
  </div>

  <!-- 对话脚本置于 pjax 容器内：局部换页后重新执行 -->
  <script>
    // 原为 BotUI 0.3.9 驱动，现以约百行原生 JS 等价复刻：
    // 剧本、节奏（先"输入中"三点动画再显示内容）与按钮分支行为均与原实现一致
    (function () {
      var box = document.getElementById('chat-box');
      if (!box) return;

      var sleep = function (ms) {
        return new Promise(function (resolve) { setTimeout(resolve, ms); });
      };
      var scrollToBottom = function () {
        box.scrollTop = box.scrollHeight;
      };

      // 追加一条气泡消息；content 支持 "![alt](url)" 图片语法（剧本中仅"告辞"一处）
      async function botMessage(content, delay) {
        var typing = document.createElement('div');
        typing.className = 'chat-typing';
        typing.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
        box.appendChild(typing);
        scrollToBottom();
        await sleep(delay);
        typing.remove();

        var message = document.createElement('div');
        message.className = 'chat-msg';
        var image = content.trim().match(/^!\[(.*)\]\((.+)\)$/);
        if (image) {
          var img = document.createElement('img');
          img.className = 'chat-msg-image';
          img.src = image[2];
          img.alt = image[1];
          message.appendChild(img);
        } else {
          message.textContent = content;
        }
        box.appendChild(message);
        scrollToBottom();
      }

      // 渲染分支按钮组：访客点选后按钮组移除，所选"提问"以右侧气泡显示，Promise 返回所选项
      function botButtons(delay, actions) {
        return new Promise(function (resolve) {
          setTimeout(function () {
            var wrap = document.createElement('div');
            wrap.className = 'chat-actions';
            actions.forEach(function (action) {
              var button = document.createElement('button');
              button.type = 'button';
              button.className = 'chat-btn';
              button.textContent = action.text;
              button.addEventListener('click', function () {
                wrap.remove();
                // 复刻 botui 行为：所选选项作为右侧（human）气泡留在对话流中
                var chosen = document.createElement('div');
                chosen.className = 'chat-msg human';
                chosen.textContent = action.text;
                box.appendChild(chosen);
                scrollToBottom();
                resolve({ value: action.value });
              });
              wrap.appendChild(button);
            });
            box.appendChild(wrap);
            scrollToBottom();
          }, delay);
        });
      }

      async function play() {
        await botMessage('Hi, 欢迎你的来访', 200);
        await botMessage('愿得一人心 白首不相离', 1000);
        await botMessage('记录日常生活 留住感动', 1000);
        var first = await botButtons(1500, [
          { text: '听我介绍', value: 'and' },
          { text: '结束介绍', value: 'gg' }
        ]);
        if (first.value === 'gg') {
          await botMessage(' ![告辞](/assets/portal/img/goodbye.jpg) ', 1500);
          return;
        }
        await botMessage('情侣小站Like Girl是 Ki 的原创项目', 1500);
        await botMessage('在2022年暑假的假期最后几天里发布了1.0版本', 1500);
        await botMessage('最新版本为 v5.2.0 亦是最终版本 目前已开源到码云', 1500);
        await botMessage('PHP确实是 “世界上最好的语言”  我非常喜欢（痛苦', 1500);
        await botMessage('在开发过程中遇到了许多奇葩问题 也是只能自己探索解决...', 1500);
        await botMessage('喜欢探索编程领域 热爱学习新知识 热爱开源文化', 1500);
        await botButtons(1500, [{ text: '为什么叫 Ki？', value: 'next' }]);
        await botMessage('不知道你有没有看过《比悲伤更悲伤的故事》', 1500);
        await botMessage('嗨，我是k，如果有下辈子的话，', 1500);
        await botMessage('“我想当戒指，眼镜，床和笔记本，这样的话，我就可以...”', 1500);
        await botMessage('当然跟这个没有关系哈哈', 1500);
        await botButtons(1500, [{ text: '结束对话', value: 'end' }]);
        await botMessage('感谢你的来访，祝你们幸福长长久久~', 1500);
      }

      play();
    })();
  </script>
</div>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
