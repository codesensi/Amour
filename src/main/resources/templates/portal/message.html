<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('留言板')}"></head>
<body>

<div th:replace="~{fragments/layout :: header}"></div>
<div th:replace="~{fragments/layout :: hero}"></div>

<!-- 内容：留言板 -->
<div id="pjax-container">
  <!-- 点击滚动到留言区（照搬） -->
  <div class="MessageButtonCard" id="MessageBtn">
    <svg t="1730880204691" class="Message-Icon icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M512 96C229.2 96 0 282.3 0 512c0 92.1 36.8 177.1 99.1 246 4 4.5 5.3 10.9 3.1 16.5-5.7 14.7-12 29.2-19 43.3-12.9 26.3-28.2 51.7-45.3 75.5-6.2 8.6-7.7 19.7-4.1 29.6 3.6 10 11.9 17.5 22.2 20.1 9.4 2.4 25.2 5.4 44.8 5.4 26 0 58.7-5.4 91.5-25 21.4-12.8 37.5-28.6 49.3-44 4.5-5.9 12.5-7.9 19.3-4.8 74.2 34 159.8 53.4 251 53.4 282.8 0 512-186.3 512-416S794.8 96 512 96z m192 464c-30.9 0-56-25.1-56-56s25.1-56 56-56 56 25.1 56 56-25.1 56-56 56z m-440-56c0-30.9 25.1-56 56-56s56 25.1 56 56-25.1 56-56 56-56-25.1-56-56z m192 0c0-30.9 25.1-56 56-56s56 25.1 56 56-25.1 56-56 56-56-25.1-56-56z" fill="#6a6a6a"/></svg>
  </div>
  <div class="central central-800 bg">
    <div class="title mt-2rem">
      <h1>在这里写下我们的留言祝福</h1>
    </div>
    <h3>已收到 <b id="leavingCount">0</b> 条祝福留言<i class="jiequ">（显示最新 100条）</i></h3>

    <div class="row">
      <div class="card col-lg-12 col-md-12 col-sm-12 col-sm-x-12">
        <!-- 留言列表：接口口子 GET /love/messages -->
        <div id="leavingList"><div class="portal-empty">留言加载中…</div></div>

        <!-- 提交表单：接口口子 POST /love/messages {qq, name, text} -->
        <form onsubmit="return false">
          <div class="inputbox" id="MessageArea">
            <img src="https://q1.qlogo.cn/g?b=qq&nk=1234567&s=100" alt="" class="avatar">
            <input id="QQ" type="text" name="qq" placeholder="请输入QQ号码" class="rig">
            <input id="nickname" type="text" name="name" placeholder="输入QQ号码后自动获取" class="let">
          </div>
          <textarea name="text" id="wenben" rows="8" placeholder="请输入您的留言内容..."></textarea>
          <div class="input-sub">
            <button type="button" id="leavingPost" class="tijiao">提交留言
              <svg style="width:1.3em;height:1.3em;" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg"><path d="M620.8 179.2c12.8 12.8 6.4 32-6.4 44.8-19.2 6.4-38.4 6.4-44.8-12.8-44.8-70.4-128-115.2-217.6-115.2-140.8 0-256 115.2-256 256 0 89.6 44.8 166.4 115.2 217.6 19.2 6.4 19.2 25.6 12.8 38.4-12.8 19.2-32 19.2-44.8 12.8C89.6 563.2 32 460.8 32 352c0-179.2 140.8-320 320-320 108.8 0 211.2 57.6 268.8 147.2zM326.4 332.8l243.2 601.6 83.2-243.2c6.4-19.2 19.2-32 38.4-38.4L934.4 576 326.4 332.8z m25.6-57.6L960 518.4c32 12.8 51.2 51.2 38.4 83.2-6.4 19.2-19.2 32-38.4 38.4l-243.2 83.2L633.6 960c-12.8 32-44.8 51.2-83.2 38.4-19.2-6.4-32-19.2-38.4-38.4L268.8 358.4c-12.8-32 6.4-70.4 38.4-83.2 12.8-6.4 32-6.4 44.8 0z" fill="#ffffff"/></svg>
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<div th:replace="~{fragments/layout :: sidebar}"></div>
<div th:replace="~{fragments/layout :: footer}"></div>
<div th:replace="~{fragments/layout :: scripts}"></div>

</body>
</html>
