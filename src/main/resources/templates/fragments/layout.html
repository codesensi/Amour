<!DOCTYPE html>
<!--
 * 门户公共外壳片段 —— 全站唯一来源（Thymeleaf 片段化，替代原 6 个静态页的重复外壳）
 * 包含：head 资源引入 / 头部导航条 / 首屏英雄区 / 悬浮侧栏 / 页脚 / 尾部脚本
 * 页面模板通过 th:replace 显式组合这些片段，修改公共结构只需改这一处
-->
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">

<!-- 页面头部：meta + 标题 + 全部样式引入（经 resourceUrlProvider 生成内容指纹 URL，自动管理缓存失效） -->
<head th:fragment="head(title)">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no">
  <title th:text="${title}">站点名</title>
  <link rel="shortcut icon" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/img/favicon.ico')}">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/portal.css')}">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/content.css')}">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/breakpoints/max-768.css')}" media="(max-width: 768px)">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/breakpoints/min-768.css')}" media="(min-width: 768px)">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/breakpoints/min-960.css')}" media="(min-width: 960px)">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/breakpoints/min-1200.css')}" media="(min-width: 1200px)">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/pages/moments.css')}">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/pages/message.css')}">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/pages/about.css')}">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/pages/love-photo.css')}">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/css/pages/love-list.css')}">
  <link rel="stylesheet" th:href="${resourceUrlProvider.getForLookupPath('/assets/portal/icons/iconfont-list.css')}">
</head>

<body>

<!-- 头部导航条：固定吸顶毛玻璃（样式 portal.css .header-wrap；滚动变色 portal.js initHeaderScrollColor） -->
<div th:fragment="header">
  <div class="header-wrap">
    <div class="header">
      <div class="logo">
        <h1><a class="alogo" href="/"></a></h1>
      </div>
      <!-- 文案由 portal.js 从站点配置（sys_config）注入，页面内不硬编码 -->
      <div class="word" data-tip="" data-tip-position="bottom">
        <span class="wenan"></span>
      </div>
    </div>
  </div>
</div>

<!-- 首屏：背景壁纸 + 双头像心跳 + 四层波浪 -->
<div th:fragment="hero">
  <div class="bg-wrap">
    <div class="bg-img">
      <div class="central central-800">
        <div class="middle animated fadeInDown">
          <div class="img-female">
            <img src="https://q1.qlogo.cn/g?b=qq&nk=673822943&s=640" draggable="false">
            <span>Su</span>
          </div>
          <div class="love-icon">
            <img src="/assets/portal/img/like.svg" draggable="false">
          </div>
          <div class="img-male">
            <img src="https://q1.qlogo.cn/g?b=qq&nk=2623669948&s=640" draggable="false">
            <span>Li</span>
          </div>
        </div>
      </div>
      <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
           viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
        <defs>
          <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"/>
        </defs>
        <g class="parallax">
          <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7"/>
          <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)"/>
          <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)"/>
          <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff"/>
        </g>
      </svg>
    </div>
  </div>
</div>

<!-- 右下角悬浮侧栏：返回顶部 / 小站首页 / 管理后台 / 开源地址 -->
<div th:fragment="sidebar">
  <div class="lg-sidebar">
    <ul>
      <li class="lg-sidebar-item" title="返回顶部" onclick="scrollToTop()">
        <svg class="lg-sidebar-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <path d="M898.346667 932.693333c-9.088 9.088-18.176 9.088-31.744 4.565334L512.853333 738.133333l-354.346666 200.234667c-13.653333 4.522667-22.741333 4.522667-31.786667-4.522667-9.045333-9.045333-9.045333-18.133333-9.045333-27.221333l373.418666-835.626667c0.042667-9.045333 13.653333-13.653333 22.741334-13.653333 9.088 0 18.133333 9.045333 22.656 13.568l366.421333 839.125333c4.48 4.522667-0.042667 18.133333-4.608 22.698667z" fill="#ffffff"/>
        </svg>
      </li>
      <li class="lg-sidebar-item" title="小站首页" onclick="portalNavigate('/')">
        <svg class="lg-sidebar-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <path d="M920.38 408.41L584.24 65.21c-0.3-0.3-0.6-0.59-0.92-0.88-19.1-17.18-44.43-26.65-71.33-26.65-26.89 0-52.23 9.46-71.33 26.65-0.32 0.28-0.62 0.58-0.92 0.88l-336.12 343.2c-3.52 3.6-5.48 8.31-5.48 13.19v474.47c0.01 50.74 45.48 92.02 101.35 92.02H347.6c11.43 0 20.69-8.72 20.69-19.47V699.74c0-29.27 26.9-53.09 59.95-53.09h167.5c33.06 0 59.95 23.81 59.95 53.09v268.89c0 10.75 9.26 19.47 20.69 19.47h148.11c55.88 0 101.34-41.28 101.34-92.03V421.61c0.02-4.89-1.93-9.6-5.45-13.2z" fill="#ffffff"/>
        </svg>
      </li>
      <li class="lg-sidebar-item" title="管理后台" onclick="portalGoAdmin()">
        <svg class="lg-sidebar-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <path d="M237.888 79.488l109.056 85.696a381.312 381.312 0 0 1 68.576-24.96L443.936 4.48a516.768 516.768 0 0 1 136.064 0l28.48 135.744c23.808 6.176 46.72 14.56 68.544 24.96l109.056-85.696a514.56 514.56 0 0 1 104.192 87.52L824.864 289.28c14.08 19.744 26.304 40.864 36.48 63.136l138.72 4.48c13.504 42.496 21.632 87.456 23.52 133.984l-128.768 51.616c-1.92 24.672-6.208 48.672-12.608 71.84L985.6 706.88a511.424 511.424 0 0 1-68.128 117.76l-131.84-43.2a385.824 385.824 0 0 1-55.808 46.848l19.712 137.408a508.352 508.352 0 0 1-127.872 46.528l-73.216-117.92a388.576 388.576 0 0 1-72.896 0l-73.216 117.92a508.352 508.352 0 0 1-127.84-46.528l19.68-137.408a385.888 385.888 0 0 1-55.808-46.88l-131.84 43.264A511.488 511.488 0 0 1 38.4 706.88l103.36-92.576c-6.368-23.168-10.624-47.168-12.576-71.84L0.416 490.88c1.92-46.528 9.984-91.488 23.52-134.016l138.688-4.48c10.208-22.24 22.432-43.36 36.512-63.104L133.696 167.04a514.56 514.56 0 0 1 104.192-87.52zM512 704a192 192 0 1 0 0-384 192 192 0 0 0 0 384z" fill="#ffffff"/>
        </svg>
      </li>
      <li class="lg-sidebar-item" title="开源地址" onclick="portalGoRepo()">
        <svg class="lg-sidebar-icon" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
          <path d="M0.064 556.416c0 46.4 4.352 88.384 13.024 125.92s20.704 70.176 36.064 97.888 34.88 52.064 58.592 73.12c23.712 21.024 49.408 38.24 77.12 51.584s59.328 24.192 94.88 32.544c35.552 8.352 71.84 14.176 108.896 17.536s77.792 4.992 122.176 4.992c44.736 0 85.632-1.664 122.688-4.992s73.44-9.184 109.152-17.536 67.52-19.2 95.392-32.544c27.872-13.344 53.76-30.528 77.6-51.584s43.552-45.408 59.072-73.12 27.616-60.352 36.288-97.888c8.672-37.568 13.024-79.552 13.024-125.92 0-82.784-27.712-154.4-83.104-214.816 3.008-8 5.76-17.12 8.256-27.296s4.832-24.704 7.008-43.552c2.176-18.848 1.344-40.64-2.496-65.344s-10.944-49.92-21.28-75.616l-7.52-1.504c-5.344-0.992-14.112-0.736-26.304 0.768s-26.368 4.512-42.56 9.024c-16.192 4.512-37.056 13.184-62.592 26.048s-52.48 28.96-80.864 48.32c-48.736-13.344-115.68-20.032-200.8-20.032-84.8 0-151.552 6.688-200.288 20.032-28.384-19.36-55.488-35.456-81.376-48.32s-46.496-21.536-61.856-26.048c-15.36-4.512-29.696-7.424-43.072-8.768s-21.792-1.76-25.28-1.248-6.272 1.088-8.256 1.76c-10.336 25.696-17.44 50.912-21.28 75.616s-4.672 46.496-2.496 65.344 4.512 33.376 7.008 43.552c2.496 10.176 5.248 19.264 8.256 27.296-55.424 60.416-83.136 132.032-83.136 214.816zM125.76 682.08c0-48.064 21.856-92.128 65.6-132.192 13.024-12.032 28.192-21.12 45.568-27.296s36.96-9.664 58.848-10.528c21.856-0.832 42.816-0.672 62.848 0.512s44.736 2.752 74.112 4.768c29.376 2.016 54.752 3.008 76.128 3.008s46.72-0.992 76.096-3.008c29.376-2.016 54.08-3.584 74.112-4.768s40.96-1.344 62.848-0.512c21.856 0.832 41.472 4.352 58.848 10.528s32.544 15.264 45.568 27.296c43.744 39.392 65.6 83.456 65.6 132.192 0 28.704-3.584 54.176-10.784 76.352s-16.352 40.8-27.552 55.84-26.688 27.776-46.56 38.304c-19.872 10.528-39.232 18.624-58.08 24.288s-43.072 10.112-72.608 13.28c-29.536 3.168-55.904 5.088-79.104 5.76s-52.672 0.992-88.384 0.992-65.184-0.32-88.384-0.992c-23.2-0.672-49.568-2.592-79.104-5.76s-53.76-7.584-72.608-13.28c-18.848-5.664-38.208-13.76-58.08-24.288s-35.392-23.296-46.56-38.304c-11.168-15.008-20.352-33.632-27.552-55.84s-10.752-47.648-10.752-76.352zM640.064 672c0-53.024 28.64-96 64-96s64 42.976 64 96c0 53.024-28.64 96-64 96s-64-42.976-64-96zM256.064 672c0-53.024 28.64-96 64-96s64 42.976 64 96c0 53.024-28.64 96-64 96s-64-42.976-64-96z" fill="#ffffff"/>
        </svg>
      </li>
    </ul>
  </div>
</div>

<!-- 页脚：ICP 备案 + 版权（备案链接为固定地址写死在下方 href；备案文案与版权行由 portal.js 从站点配置注入） -->
<div th:fragment="footer">
  <div class="footer-warp">
    <div class="footer">
      <p><img src="/assets/portal/img/icp.svg"><a id="footerIcpLink" href="https://beian.miit.gov.cn/#/Integrated/index" target="_blank"></a></p>
      <p id="footerCopyright"></p>
    </div>
  </div>
</div>

<!-- 尾部脚本：第三方库 + 门户逻辑 + pjax；icon-tupian 精灵图原站缺失，全局内联补充（点点滴滴页列表引用） -->
<div th:fragment="scripts">
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="icon-tupian" viewBox="0 0 1024 1024">
      <path d="M810.666667 213.333333H213.333333a85.333333 85.333333 0 0 0-85.333333 85.333334v426.666666a85.333333 85.333333 0 0 0 85.333333 85.333334h597.333334a85.333333 85.333333 0 0 0 85.333333-85.333334V298.666667a85.333333 85.333333 0 0 0-85.333333-85.333334z m0 512H213.333333V298.666667h597.333334v426.666666zM341.333333 384a64 64 0 1 0 128 0 64 64 0 0 0-128 0z m128 128l-128 170.666667h512l-170.666666-256-128 170.666666-85.333334-85.333333z"/>
    </symbol>
  </svg>
  <script th:src="${resourceUrlProvider.getForLookupPath('/assets/portal/icons/iconfont-sprite.js')}"></script>
  <!-- 门户 ESM 入口：经 import 加载 common/pjax、common/config 与门户业务 -->
  <script type="module" th:src="${resourceUrlProvider.getForLookupPath('/assets/portal/main.js')}"></script>
</div>

</body>
</html>
