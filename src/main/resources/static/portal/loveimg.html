    .icon { width: 1.5em; height: 1.5em; vertical-align: -0.3em; fill: currentColor; overflow: hidden; }
    .loading { text-align: center; color: #999; padding: 2rem 0; display: none; }
    .load-more { text-align: center; padding: 1rem 0 3rem; }
    .lg-btn-alt {
      padding: .8rem 2.5rem;
      border: 1px solid #ddd;
      border-radius: 2rem;
      background: #fff;
      color: #666;
      font-size: 1rem;
      cursor: pointer;
      transition: all .2s;
    }
    .lg-btn-alt:hover:not(:disabled) { color: #10bbff; border-color: #10bbff; }
    .lg-btn-alt:disabled { background: #888; opacity: .6; cursor: not-allowed; }
  </style>

<body>

<!-- 头部导航条 -->
<div class="header-wrap">
  <div class="header">
    <div class="logo">
      <h1><a class="alogo" href="/">龙猫の爱恋</a></h1>
    </div>
    <div class="word" data-tip="爱晨雾漫过青瓦，爱暮色染透篱笆，更爱与君并肩立，看遍这人间烟火里的朝暮与年华。" data-tip-position="bottom">
      <span class="wenan">爱晨雾漫过青瓦，爱暮色染透篱笆，更爱与君并肩立，看遍这人间烟火里的朝暮与年华。</span>
    </div>
  </div>
</div>

<!-- 首屏：背景 + 双头像心跳 + 四层波浪 -->
<div class="bg-wrap">
  <div class="bg-img">
    <div class="central central-800">
      <div class="middle animated fadeInDown">
        <div class="img-female">
          <img src="https://q1.qlogo.cn/g?b=qq&nk=673822943&s=640" draggable="false">
          <span>Su</span>
        </div>
        <div class="love-icon">
          <img src="/assets/portal/img/like.svg" draggable="false">
        </div>
        <div class="img-male">
          <img src="https://q1.qlogo.cn/g?b=qq&nk=2623669948&s=640" draggable="false">
          <span>Li</span>
        </div>
      </div>
    </div>
    <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
         viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
      <defs>
        <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s 58 18 88 18 58-18 88-18 58 18 88 18 v44h-352z"/>
      </defs>
      <g class="parallax">
        <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(255,255,255,0.7"/>
        <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(255,255,255,0.5)"/>
        <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(255,255,255,0.3)"/>
        <use xlink:href="#gentle-wave" x="48" y="7" fill="#fff"/>
      </g>
    </svg>
  </div>
</div>

<!-- 内容：恋爱相册（接口口子 POST /love/photos） -->
<div id="pjax-container">
  <h4 class="text-ce central">记录下你的最美瞬间</h4>
  <div class="row central gallery" id="photoGallery"></div>

  <div class="loading" id="loading">数据加载中...</div>

  <div class="load-more">
    <button class="lg-btn-alt" id="loadMoreBtn">加载更多</button>
  </div>
</div>
