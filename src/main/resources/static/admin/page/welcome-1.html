<style>
    /** 后台管理主页样式 */
    .admin-home .layui-card { box-shadow: 0 1px 3px rgba(0, 0, 0, .06); }

    /* 欢迎条 */
    .admin-home-welcome {
        padding: 18px 22px;
        background: linear-gradient(120deg, #1E9FFF, #5FB878);
        border-radius: 2px;
        color: #ffffff;
    }
    .admin-home-welcome h1 { font-size: 20px; margin-bottom: 4px; }
    .admin-home-welcome p { color: rgba(255, 255, 255, .85); font-size: 13px; margin: 0; }

    /* 统计卡片 */
    .admin-stat-card { padding: 18px 20px; }
    .admin-stat-card .admin-stat-icon {
        width: 48px; height: 48px; line-height: 48px;
        border-radius: 50%; text-align: center; font-size: 22px;
        color: #ffffff; float: left;
    }
    .admin-stat-card .admin-stat-value {
        margin-left: 62px; font-size: 26px; font-weight: 600; line-height: 1.2;
    }
    .admin-stat-card .admin-stat-title { margin-left: 62px; color: #999; font-size: 13px; }
    .admin-stat-blue { background: #1E9FFF; }
    .admin-stat-green { background: #5FB878; }
    .admin-stat-orange { background: #FFB800; }
    .admin-stat-cyan { background: #16BAAA; }

    /* 快捷入口 */
    .admin-quick a { display: block; text-align: center; padding: 12px 0 10px; color: #666; border-radius: 2px; }
    .admin-quick a:hover { background: #F8F8F8; color: #1E9FFF; }
    .admin-quick i { display: block; font-size: 26px; margin-bottom: 6px; }
    .admin-quick cite { font-style: normal; font-size: 13px; }

    /* 系统信息 */
    .admin-sysinfo li { margin-bottom: 10px; color: #666; font-size: 13px; }
    .admin-sysinfo li span { color: #333; }
</style>

<div class="layuimini-container layuimini-page-anim admin-home">
    <div class="layuimini-main">

        <!-- 欢迎条 -->
        <div class="admin-home-welcome">
            <h1>您好，admin，欢迎回来！</h1>
            <p id="adminHomeDate">Amour 后台管理系统 · 今天也要元气满满</p>
        </div>

        <!-- 数据统计 -->
        <div class="layui-row layui-col-space15" style="margin-top: 15px;">
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card admin-stat-card">
                    <i class="admin-stat-icon admin-stat-blue layui-icon layui-icon-username"></i>
                    <div class="admin-stat-value" id="statUserTotal">0</div>
                    <div class="admin-stat-title">用户总数</div>
                </div>
            </div>
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card admin-stat-card">
                    <i class="admin-stat-icon admin-stat-green layui-icon layui-icon-vercode"></i>
                    <div class="admin-stat-value" id="statTodayLogin">0</div>
                    <div class="admin-stat-title">今日登录</div>
                </div>
            </div>
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card admin-stat-card">
                    <i class="admin-stat-icon admin-stat-orange layui-icon layui-icon-connection"></i>
                    <div class="admin-stat-value" id="statOnlineTotal">0</div>
                    <div class="admin-stat-title">当前在线</div>
                </div>
            </div>
            <div class="layui-col-xs6 layui-col-md3">
                <div class="layui-card admin-stat-card">
                    <i class="admin-stat-icon admin-stat-cyan layui-icon layui-icon-list"></i>
                    <div class="admin-stat-value" id="statMenuTotal">0</div>
                    <div class="admin-stat-title">菜单数量</div>
                </div>
            </div>
        </div>

        <!-- 快捷入口 -->
        <div class="layui-card" style="margin-top: 5px;">
            <div class="layui-card-header">快捷导航</div>
            <div class="layui-card-body">
                <div class="layui-row layui-col-space10 admin-quick">
                    <div class="layui-col-xs4 layui-col-md2">
                        <a layuimini-content-href="page/menu.html" data-title="菜单管理" data-icon="layui-icon layui-icon-menu-fill">
                            <i class="layui-icon layui-icon-menu-fill"></i><cite>菜单管理</cite>
                        </a>
                    </div>
                    <div class="layui-col-xs4 layui-col-md2">
                        <a layuimini-content-href="page/user-setting.html" data-title="基本资料" data-icon="layui-icon layui-icon-user">
                            <i class="layui-icon layui-icon-user"></i><cite>基本资料</cite>
                        </a>
                    </div>
                    <div class="layui-col-xs4 layui-col-md2">
                        <a layuimini-content-href="page/user-password.html" data-title="修改密码" data-icon="layui-icon layui-icon-password">
                            <i class="layui-icon layui-icon-password"></i><cite>修改密码</cite>
                        </a>
                    </div>
                    <div class="layui-col-xs4 layui-col-md2">
                        <a layuimini-content-href="page/table.html" data-title="表格示例" data-icon="layui-icon layui-icon-list">
                            <i class="layui-icon layui-icon-list"></i><cite>表格示例</cite>
                        </a>
                    </div>
                    <div class="layui-col-xs4 layui-col-md2">
                        <a layuimini-content-href="page/upload.html" data-title="文件上传" data-icon="layui-icon layui-icon-upload">
                            <i class="layui-icon layui-icon-upload"></i><cite>文件上传</cite>
                        </a>
                    </div>
                    <div class="layui-col-xs4 layui-col-md2">
                        <a layuimini-content-href="page/editor.html" data-title="富文本" data-icon="layui-icon layui-icon-edit">
                            <i class="layui-icon layui-icon-edit"></i><cite>富文本</cite>
                        </a>
                    </div>
                </div>
            </div>
        </div>

        <!-- 登录趋势 + 系统信息 -->
        <div class="layui-row layui-col-space15">
            <div class="layui-col-md8">
                <div class="layui-card">
                    <div class="layui-card-header">近 7 日登录趋势</div>
                    <div class="layui-card-body">
                        <div id="adminLoginTrendChart" style="height: 300px;"></div>
                    </div>
                </div>
            </div>
            <div class="layui-col-md4">
                <div class="layui-card">
                    <div class="layui-card-header">系统信息</div>
                    <div class="layui-card-body">
                        <ul class="admin-sysinfo" style="list-style: none; padding: 0; margin: 0;">
                            <li>后端框架：<span>Spring Boot</span></li>
                            <li>运行环境：<span>Java 21</span></li>
                            <li>数据存储：<span>H2 内存数据库（开发）</span></li>
                            <li>前端框架：<span>layui 2.13.9 + layuimini</span></li>
                            <li>当前模式：<span id="adminRunMode">-</span></li>
                            <li>权限框架：<span>Sa-Token</span></li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    layui.use(['echarts', 'api'], function () {
        var $ = layui.$,
            echarts = layui.echarts,
            api = layui.api,
            cfg = window.APP_API;

        // 日期问候
        var now = new Date();
        var hour = now.getHours();
        var hello = hour < 6 ? '凌晨好' : hour < 9 ? '早上好' : hour < 12 ? '上午好' : hour < 14 ? '中午好' : hour < 18 ? '下午好' : '晚上好';
        $('#adminHomeDate').text(now.getFullYear() + ' 年 ' + (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日 · ' + hello + '，祝您工作顺利');
        $('#adminRunMode').text(cfg.mock ? '本地 Mock 模拟' : '真实后端对接');

        // 统计数据：经统一请求层获取（mock 读 api/statistics.json，真实模式对接 /admin/dashboard）
        api.request('statistics').done(function (data) {
            if (!data) return;
            $('#statUserTotal').text(data.userTotal || 0);
            $('#statTodayLogin').text(data.todayLogin || 0);
            $('#statOnlineTotal').text(data.onlineTotal || 0);
            $('#statMenuTotal').text(data.menuTotal || 0);

            // 登录趋势图
            var trend = data.loginTrend || {dates: [], values: []};
            var chartDom = document.getElementById('adminLoginTrendChart');
            var chart = echarts.init(chartDom);
            chart.setOption({
                tooltip: {trigger: 'axis'},
                grid: {left: 40, right: 20, top: 30, bottom: 30},
                xAxis: {type: 'category', boundaryGap: false, data: trend.dates},
                yAxis: {type: 'value'},
                series: [{
                    name: '登录次数',
                    type: 'line',
                    smooth: true,
                    areaStyle: {opacity: 0.15},
                    itemStyle: {color: '#1E9FFF'},
                    data: trend.values
                }]
            });
            window.onresize = function () { chart.resize(); };
        });
    });
</script>
