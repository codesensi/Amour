<div class="layuimini-container layuimini-page-anim">
    <div class="layuimini-main">
        <blockquote class="layui-elem-quote">
            富文本编辑器使用开源项目：wangEditor<br>
            mock 模式下图片以 base64 本地预览；真实模式下上传接口经统一请求层管理，响应统一为 Result 格式
            <a href="http://www.wangeditor.com" target="_blank" class="layui-btn layui-btn-danger">wangEditor</a>
        </blockquote>
        <div id="editor" style="margin: 50px 0 50px 0">
            <p>欢迎使用 <b>wangEditor</b> 富文本编辑器</p>
        </div>

    </div>
</div>
<script type="text/javascript">
    layui.use(['layer', 'wangEditor', 'api'], function () {
        var $ = layui.jquery,
            layer = layui.layer,
            wangEditor = layui.wangEditor,
            api = layui.api,
            cfg = window.APP_API;

        var editor = new wangEditor('#editor');

        if (cfg.mock) {
            // mock 模式：图片转 base64 本地预览（静态容器不支持 POST 上传）
            editor.customConfig.uploadImgShowBase64 = true;
        } else {
            // 真实模式：上传至后端统一上传接口，响应统一 Result 格式
            editor.customConfig.uploadImgServer = api.url('upload');
            editor.customConfig.uploadFileName = 'file';
            editor.customConfig.uploadImgHooks = {
                customInsert: function (insertImg, result) {
                    if (result.code === cfg.successCode) {
                        var url = (result.data && result.data.url) || [];
                        layui.each([].concat(url), function (i, e) {
                            insertImg(e);
                        });
                    } else {
                        layer.msg(result.msg);
                    }
                }
            };
        }

        editor.customConfig.pasteFilterStyle = false;
        editor.customConfig.uploadImgMaxLength = 5;
        editor.customConfig.customAlert = function (info) {
            layer.msg(info);
        };
        editor.create();
    });
</script>
