<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>后台登录</title>
  <link rel="shortcut icon" href="/assets/portal/img/favicon.ico">
  <link rel="stylesheet" href="/assets/layui/2.13.9/css/layui.css">
  <!-- 登录页专属样式（夜幕星河品牌动画 + 登录卡片） -->
  <link rel="stylesheet" href="/assets/admin/css/login.css">
</head>
</head>
<body>
  <div class="login-page">
    <!-- 星空：铺满全屏的夜幕星点 -->
    <div class="stars" aria-hidden="true"></div>
    <div class="stars stars-2" aria-hidden="true"></div>
    <!-- 左屏：心跳星河品牌动画（站名/标语/双头像/恋爱计时均来自项目配置） -->
    <div class="login-brand">
      <div class="brand-scene">
        <canvas id="heartCanvas"></canvas>
        <div class="orbit">
          <img class="orbit-avatar" id="brandFemaleAvatar" alt="女主头像">
          <img class="orbit-avatar orbit-avatar-b" id="brandMaleAvatar" alt="男主头像">
        </div>
      </div>
      <div class="brand-copy">
        <div class="brand-name" id="brandName"></div>
        <div class="brand-slogan" id="brandSlogan"></div>
        <div class="brand-days" id="brandDays"></div>
      </div>
      <div class="brand-hearts" aria-hidden="true">
        <i class="layui-icon layui-icon-heart-fill"></i>
        <i class="layui-icon layui-icon-heart-fill"></i>
        <i class="layui-icon layui-icon-heart-fill"></i>
        <i class="layui-icon layui-icon-heart-fill"></i>
        <i class="layui-icon layui-icon-heart-fill"></i>
      </div>
    </div>

    <!-- 右屏：登录卡片 -->
    <div class="login-panel">
      <div class="login-card">
        <div class="login-title"><i class="layui-icon layui-icon-heart-fill"></i> 欢迎回来</div>
        <div class="login-sub">守护这段爱情故事的每一天</div>

        <form class="layui-form" lay-filter="login-form" lay-key="1">
          <div class="layui-form-item">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix"><i class="layui-icon layui-icon-username"></i></div>
              <input type="text" name="username" lay-verify="required" placeholder="用户名"
                     autocomplete="username" class="layui-input" lay-affix="clear">
            </div>
          </div>
          <div class="layui-form-item">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix"><i class="layui-icon layui-icon-password"></i></div>
              <input type="password" name="password" lay-verify="required" placeholder="密码"
                     autocomplete="current-password" class="layui-input" lay-affix="eye">
            </div>
          </div>
          <div class="layui-form-item" id="captchaItem">
            <div class="captcha-row">
              <div class="captcha-box" id="captchaBox" title="点击刷新验证码">
                <img id="captchaImg" src="" alt="验证码">
              </div>
              <div class="layui-input-wrap captcha-input">
                <div class="layui-input-prefix"><i class="layui-icon layui-icon-vercode"></i></div>
                <input type="text" name="captcha" lay-verify="required" placeholder="验证码"
                       autocomplete="off" class="layui-input" maxlength="8">
              </div>
            </div>
          </div>
          <div class="layui-form-item">
            <button class="layui-btn login-btn" lay-submit lay-filter="login-submit">
              <i class="layui-icon layui-icon-release"></i> 登 录
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 后台登录页模块：登录处理、品牌信息与粒子动画（依赖上方 layui 全局） -->
  <script src="/assets/layui/2.13.9/layui.js"></script>
  <script type="module" src="/admin/js/login.js"></script>
</body>
</html>
