<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amour - 后台登录</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/layui/2.13.9/css/layui.css">
  <style>
    /* 后台登录页自定义样式 */
    html, body { height: 100%; }
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #16b777 0%, #2f9be0 100%);
    }
    .login-card {
      width: 380px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, .18);
      padding: 38px 36px 30px;
    }
    .login-card .login-title {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      color: #333;
      margin-bottom: 6px;
    }
    .login-card .login-sub {
      text-align: center;
      color: #999;
      font-size: 12px;
      margin-bottom: 28px;
    }
    .login-card .layui-icon { color: #bbb; }
    /* 验证码行：验证码图在左、输入框在右，两者等分整行（左右边缘与用户名/密码行对齐） */
    .captcha-row { display: flex; gap: 10px; }
    /* 验证码：/captcha 返回 captchaValue 为 base64 图片 data URI，点击图片刷新 */
    .captcha-box {
      flex: 1;
      min-width: 0;
      height: 38px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      border-radius: 3px;
      border: 1px solid #eee;
      background: #f2f6f3;
    }
    /* 图片铺满显示框（aj-captcha 默认 130x48，38px 行高下轻微压扁，视觉更饱满） */
    .captcha-box img { width: 100%; height: 100%; }
    .captcha-input { flex: 1; min-width: 0; }
    .login-btn { width: 100%; margin-top: 6px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-title"><i class="layui-icon layui-icon-heart-fill" style="color:#16b777"></i> Amour 后台管理</div>
    <div class="login-sub">Spring Boot 4 · Layui 2.13.9</div>

    <form class="layui-form" lay-filter="login-form" lay-key="1">
      <div class="layui-form-item">
        <div class="layui-input-wrap">
          <div class="layui-input-prefix"><i class="layui-icon layui-icon-username"></i></div>
          <input type="text" name="username" value="sadmin" lay-verify="required" placeholder="用户名"
                 autocomplete="username" class="layui-input" lay-affix="clear">
        </div>
      </div>
      <div class="layui-form-item">
        <div class="layui-input-wrap">
          <div class="layui-input-prefix"><i class="layui-icon layui-icon-password"></i></div>
          <input type="password" name="password" lay-verify="required" placeholder="密码"
                 autocomplete="current-password" class="layui-input" lay-affix="eye">
        </div>
      </div>
      <div class="layui-form-item" id="captchaItem" style="display: none;">
        <div class="captcha-row">
          <div class="captcha-box" id="captchaBox" title="点击刷新验证码">
            <img id="captchaImg" src="" alt="验证码" style="display: none;">
          </div>
          <div class="layui-input-wrap captcha-input">
            <div class="layui-input-prefix"><i class="layui-icon layui-icon-vercode"></i></div>
            <input type="text" name="captcha" lay-verify="required" placeholder="验证码"
                   autocomplete="off" class="layui-input" maxlength="8">
          </div>
        </div>
      </div>
      <div class="layui-form-item">
        <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="login-submit" style="background:#16b777;">
          <i class="layui-icon layui-icon-release"></i> 登 录
        </button>
      </div>
    </form>
  </div>

  <script src="/assets/common/config.js"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/assets/layui/2.13.9/layui.js"></script>
  <script>
    layui.use(['form', 'jquery', 'layer'], function () {
      const $ = layui.jquery, form = layui.form, layer = layui.layer;

      // 请求守卫：同源请求统一携带 accessToken，接口返回 401 时重定向登录页
      AdminAuth.setupAjaxGuard();

      let captchaKey = '';

      // 验证码开关当前生效状态：开启时显示验证码并验证必填，关闭时不显示验证码相关内容
      let captchaEnabled = false;

      // 加载验证码：GET /captcha -> Result{success, code, msg, data:{captchaKey, captchaValue}}
      // captchaValue 为 base64 图片 data URI，直接作为 <img> 展示
      function loadCaptcha() {
        captchaKey = '';
        $('#captchaImg').hide();
        $.ajax({
          url: '/captcha',
          type: 'GET',
          dataType: 'json'
        }).done(function (res) {
          if (res.success && res.data) {
            captchaKey = res.data.captchaKey || '';
            $('#captchaImg').attr('src', res.data.captchaValue).show();
          } else {
            layer.msg(res.msg || '验证码加载失败', { icon: 2 });
          }
        }).fail(function (xhr) {
          layer.msg('验证码接口请求失败：' + xhr.status, { icon: 2 });
        });
      }

      // 点击图片刷新验证码
      $('#captchaBox').on('click', loadCaptcha);

      // 根据项目配置应用验证码开关：
      // 开启 -> 显示验证码行、输入框必填并加载验证码；关闭 -> 整行隐藏，不显示也不校验验证码
      function applyCaptchaConfig(enabled) {
        captchaEnabled = enabled;
        const $item = $('#captchaItem');
        const $input = $item.find('input[name="captcha"]');
        if (captchaEnabled) {
          $item.show();
          $input.attr('lay-verify', 'required');
          loadCaptcha();
        } else {
          $item.hide();
          $input.removeAttr('lay-verify');
        }
      }

      // MOCK_LOGIN = true：后端 /auth/login 尚未实现，表单校验通过后直接 mock 登录成功，
      // 写入本地登录态并跳转后台管理首页；后端登录接口实现后将其改为 false 即恢复走真实接口
      const MOCK_LOGIN = true;

      // 提交登录：POST /auth/login（后端实现后生效）
      form.on('submit(login-submit)', function (data) {
        if (MOCK_LOGIN) {
          // 构造与后端约定一致的登录返回体：data.accessToken + data.expiresIn（秒，-1 代表永不过期）
          const mockRes = {
            success: true,
            code: 200,
            msg: '登录成功',
            data: {
              accessToken: 'mock-' + Date.now() + '-' + Math.random().toString(36).slice(2),
              expiresIn: 7 * 24 * 60 * 60 // mock 默认 7 天；后端实现后以真实返回为准
            }
          };
          AdminAuth.saveAuth(mockRes.data, data.field.username);
          layer.msg('登录成功，正在跳转…', { icon: 1, time: 800 }, function () {
            location.href = '/admin/index.html';
          });
          return false; // 阻止表单默认提交
        }
        // 仅在验证码开启时携带验证码参数
        const payload = {
          username: data.field.username,
          password: data.field.password
        };
        if (captchaEnabled) {
          payload.captcha = data.field.captcha;
          payload.captchaKey = captchaKey;
        }
        $.ajax({
          url: '/auth/login',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(payload),
          dataType: 'json'
        }).done(function (res) {
          if (res.success) {
            AdminAuth.saveAuth(res.data, data.field.username);
            layer.msg('登录成功，正在跳转…', { icon: 1, time: 800 }, function () {
              location.href = '/admin/index.html';
            });
          } else {
            layer.msg(res.msg || '登录失败', { icon: 2 });
            loadCaptcha();
          }
        }).fail(function (xhr) {
          // 登录接口尚未实现（404）或校验失败时的兜底提示
          let msg = '登录接口请求失败：' + xhr.status;
          try { if (xhr.responseJSON && xhr.responseJSON.msg) msg = xhr.responseJSON.msg; } catch (e) { /* 忽略解析失败 */ }
          layer.msg(msg, { icon: 2 });
          loadCaptcha();
        });
        return false; // 阻止表单默认提交
      });

      // 应用项目配置的验证码开关：mock 阶段读取 config.js 内置配置表，
      // 后端公开配置接口实现后 ProjectConfig 自动切换为真实数据（sys_config: captcha.enabled）
      ProjectConfig.isOn('captcha.enabled').then(applyCaptchaConfig);
    });
  </script>
</body>
</html>
