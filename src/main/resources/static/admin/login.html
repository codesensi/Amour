<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amour - 后台登录</title>
  <link rel="shortcut icon" href="/assets/portal/img/favicon.ico">
  <link rel="stylesheet" href="/assets/layui/2.13.9/css/layui.css">
  <style>
    /* ===== 整体布局：夜幕渐变铺满全屏，左屏品牌动画 + 右屏登录卡片同处一片星河 ===== */
    html, body { height: 100%; }
    body { margin: 0; background: #0b1f2a; }
    .login-page {
      position: relative;
      display: flex;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(600px 400px at 15% 18%, rgba(22,183,119,.35), transparent 70%),
        radial-gradient(520px 380px at 85% 82%, rgba(47,155,224,.30), transparent 70%),
        linear-gradient(160deg, #0b1f2a 0%, #123a2e 55%, #16b777 150%);
    }

    /* ---- 左屏：心跳星河品牌动画 ---- */
    .login-brand {
      position: relative;
      flex: none;
      width: clamp(480px, 54%, 900px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    /* 星空：两组不同尺度的随机星点，交错闪烁 */
    .stars {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1px 1px at 25px 35px, rgba(255,255,255,.9), transparent),
        radial-gradient(1px 1px at 80px 120px, rgba(255,255,255,.7), transparent),
        radial-gradient(2px 2px at 150px 60px, rgba(255,255,255,.5), transparent),
        radial-gradient(1px 1px at 200px 160px, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 120px 210px, rgba(255,255,255,.6), transparent);
      background-size: 260px 260px;
      animation: twinkle 3.5s ease-in-out infinite alternate;
    }
    .stars-2 {
      background-image:
        radial-gradient(1px 1px at 60px 90px, rgba(255,255,255,.5), transparent),
        radial-gradient(2px 2px at 180px 20px, rgba(255,255,255,.4), transparent),
        radial-gradient(1px 1px at 110px 170px, rgba(255,255,255,.7), transparent);
      background-size: 340px 340px;
      animation: twinkle 5s ease-in-out infinite alternate-reverse;
    }
    @keyframes twinkle { from { opacity: .25; } to { opacity: 1; } }

    /* 双星轨道：两只头像沿环形轨道公转，自身反向自转保持头像始终端正 */
    .brand-scene { position: relative; width: 400px; height: 400px; flex: none; }
    /* 粒子心形画布：细小碎片聚合成红色爱心，是左屏的视觉主体 */
    #heartCanvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .orbit {
      position: absolute;
      inset: 0;
      border: 1px dashed rgba(255,255,255,.18);
      border-radius: 50%;
      animation: spin 16s linear infinite;
    }
    .orbit-avatar {
      position: absolute;
      top: -26px;
      left: calc(50% - 26px);
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,.85);
      box-shadow: 0 0 18px rgba(255,77,109,.45);
      background: #fff;
      object-fit: cover;
      animation: spin 16s linear infinite reverse;
    }
    .orbit-avatar-b { top: auto; bottom: -26px; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    /* 缓缓上浮的小爱心 */
    .brand-hearts { position: absolute; inset: 0; pointer-events: none; }
    .brand-hearts i {
      position: absolute;
      bottom: -40px;
      color: rgba(255,255,255,.35);
      animation-name: float-up;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    @keyframes float-up {
      0% { transform: translateY(0); opacity: 0; }
      12% { opacity: .55; }
      85% { opacity: .35; }
      100% { transform: translateY(-110vh); opacity: 0; }
    }

    /* 文案层：站名 / 标语 / 恋爱计时 */
    .brand-copy {
      position: relative;
      z-index: 2;
      margin-top: 46px;
      text-align: center;
      color: #fff;
    }
    .brand-name { font-size: 26px; font-weight: 700; letter-spacing: 2px; }
    .brand-slogan { margin-top: 12px; max-width: 420px; font-size: 13px; line-height: 1.8; opacity: .72; }
    /* 打字机光标：逐字输入期间显示并闪烁，完成后停留 2s 再隐藏 */
    .brand-slogan.typing::after {
      content: '▍';
      margin-left: 2px;
      color: #7dffc4;
      animation: cursor-blink .8s step-end infinite;
    }
    @keyframes cursor-blink { 50% { opacity: 0; } }
    .brand-days {
      margin-top: 24px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 20px;
      font-size: 13px;
      line-height: 1; /* 归一行高：图标/汉字/数字的字形盒等高，垂直居中即视觉居中 */
      border: 1px solid rgba(255,255,255,.25);
      border-radius: 999px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(4px);
    }
    .brand-days .num { font-size: 15px; font-weight: 700; color: #7dffc4; }
    .brand-days-heart { flex: none; width: 14px; height: 14px; fill: #ff7a9e; }

    /* 降低动效偏好：关闭全部装饰动画 */
    @media (prefers-reduced-motion: reduce) {
      .stars, .orbit, .orbit-avatar, .brand-hearts i, .login-card { animation: none; }
    }
    /* 窄屏：隐藏左屏动画，登录卡片全屏居中 */
    @media (max-width: 900px) {
      .login-brand { display: none; }
    }

    /* ---- 右屏：登录卡片（毛玻璃浮层） ---- */
    .login-panel {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }
    .login-card {
      position: relative;
      width: 100%;
      max-width: 380px;
      /* 星河玻璃：与夜幕同材质的深色半透明卡 */
      background: rgba(255,255,255,.07);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 20px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12), 0 24px 80px rgba(0, 0, 0, .45);
      padding: 38px 36px 30px;
      animation: card-in .8s ease-out both;
    }
    /* 入场：从星空中淡入上浮（仅首次） */
    @keyframes card-in {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: none; }
    }
    .login-card .login-title {
      text-align: center;
      font-size: 20px;
      font-weight: 600;
      color: #f2f7f5;
      margin-bottom: 6px;
    }
    .login-card .login-sub {
      text-align: center;
      color: rgba(255,255,255,.45);
      font-size: 12px;
      margin-bottom: 28px;
    }
    .login-card .layui-icon { color: rgba(255,255,255,.45); }
    /* 标题爱心：与左屏粒子心同款粉红，形成前后色彩呼应 */
    .login-card .login-title .layui-icon { color: #ff7a9e; }

    /* 输入框：深色玻璃质感，聚焦时品牌绿辉光 */
    .login-card .layui-input-wrap .layui-input {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.14);
      color: #eaf2f5;
    }
    .login-card .layui-input-wrap .layui-input::placeholder { color: rgba(255,255,255,.35); }
    .login-card .layui-input-wrap .layui-input:focus {
      border-color: rgba(22,183,119,.75);
      background: rgba(255,255,255,.11);
      box-shadow: 0 0 0 3px rgba(22,183,119,.18);
    }
    /* 自动填充时保持深色底（Chrome autofill 会强刷白底） */
    .login-card .layui-input:-webkit-autofill {
      -webkit-box-shadow: 0 0 0 1000px rgba(16,38,43,.9) inset;
      -webkit-text-fill-color: #eaf2f5;
    }
    .login-card .login-btn {
      border: none;
      box-shadow: 0 8px 24px rgba(22,183,119,.35);
      transition: box-shadow .2s ease, transform .2s ease;
    }
    .login-card .login-btn:hover {
      box-shadow: 0 10px 28px rgba(22,183,119,.5);
      transform: translateY(-1px);
    }

    /* 验证码行：验证码图在左、输入框在右，两者等分整行（左右边缘与用户名/密码行对齐） */
    .captcha-row { display: flex; gap: 10px; }
    /* 验证码：/captcha 返回 captchaValue 为 base64 图片 data URI，点击图片刷新 */
    .captcha-box {
      flex: 1;
      min-width: 0;
      height: 38px;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      border-radius: 3px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.08);
    }
    /* 图片铺满显示框（aj-captcha 默认 130x48，38px 行高下轻微压扁，视觉更饱满） */
    .captcha-box img { width: 100%; height: 100%; }
    .captcha-input { flex: 1; min-width: 0; }
    .login-btn { display: block; min-width: 160px; margin: 6px auto 0; }
  </style>
</head>
<body>
  <div class="login-page">
    <!-- 星空：铺满全屏的夜幕星点 -->
    <div class="stars" aria-hidden="true"></div>
    <div class="stars stars-2" aria-hidden="true"></div>
    <!-- 左屏：心跳星河品牌动画（站名/标语/双头像/恋爱计时均来自项目配置） -->
    <div class="login-brand">
      <div class="brand-scene">
        <canvas id="heartCanvas"></canvas>
        <div class="orbit">
          <img class="orbit-avatar" id="brandFemaleAvatar" alt="女主头像">
          <img class="orbit-avatar orbit-avatar-b" id="brandMaleAvatar" alt="男主头像">
        </div>
      </div>
      <div class="brand-copy">
        <div class="brand-name" id="brandName">Amour</div>
        <div class="brand-slogan" id="brandSlogan"></div>
        <div class="brand-days" id="brandDays"></div>
      </div>
      <div class="brand-hearts" aria-hidden="true">
        <i class="layui-icon layui-icon-heart-fill" style="left: 8%; font-size: 12px; animation-duration: 11s;"></i>
        <i class="layui-icon layui-icon-heart-fill" style="left: 26%; font-size: 16px; animation-duration: 13s; animation-delay: -4s;"></i>
        <i class="layui-icon layui-icon-heart-fill" style="left: 47%; font-size: 10px; animation-duration: 10s; animation-delay: -7s;"></i>
        <i class="layui-icon layui-icon-heart-fill" style="left: 68%; font-size: 15px; animation-duration: 14s; animation-delay: -2s;"></i>
        <i class="layui-icon layui-icon-heart-fill" style="left: 86%; font-size: 12px; animation-duration: 12s; animation-delay: -9s;"></i>
      </div>
    </div>

    <!-- 右屏：登录卡片 -->
    <div class="login-panel">
      <div class="login-card">
        <div class="login-title"><i class="layui-icon layui-icon-heart-fill"></i> 欢迎回来</div>
        <div class="login-sub">守护这段爱情故事的每一天</div>

        <form class="layui-form" lay-filter="login-form" lay-key="1">
          <div class="layui-form-item">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix"><i class="layui-icon layui-icon-username"></i></div>
              <input type="text" name="username" lay-verify="required" placeholder="用户名"
                     autocomplete="username" class="layui-input" lay-affix="clear">
            </div>
          </div>
          <div class="layui-form-item">
            <div class="layui-input-wrap">
              <div class="layui-input-prefix"><i class="layui-icon layui-icon-password"></i></div>
              <input type="password" name="password" lay-verify="required" placeholder="密码"
                     autocomplete="current-password" class="layui-input" lay-affix="eye">
            </div>
          </div>
          <div class="layui-form-item" id="captchaItem" style="display: none;">
            <div class="captcha-row">
              <div class="captcha-box" id="captchaBox" title="点击刷新验证码">
                <img id="captchaImg" src="" alt="验证码" style="display: none;">
              </div>
              <div class="layui-input-wrap captcha-input">
                <div class="layui-input-prefix"><i class="layui-icon layui-icon-vercode"></i></div>
                <input type="text" name="captcha" lay-verify="required" placeholder="验证码"
                       autocomplete="off" class="layui-input" maxlength="8">
              </div>
            </div>
          </div>
          <div class="layui-form-item">
            <button class="layui-btn login-btn" lay-submit lay-filter="login-submit" style="background:#16b777;">
              <i class="layui-icon layui-icon-release"></i> 登 录
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 版本参数用于更新 config.js 后击穿浏览器缓存 -->
  <script src="/assets/common/config.js?v=2"></script>
  <script src="/admin/js/auth.js"></script>
  <script src="/assets/layui/2.13.9/layui.js"></script>
  <script>
    layui.use(['form', 'jquery', 'layer'], function () {
      const $ = layui.jquery, form = layui.form, layer = layui.layer;

      // 请求守卫：同源请求统一携带 accessToken，接口返回 401 时重定向登录页
      AdminAuth.setupAjaxGuard();

      let captchaKey = '';

      // 验证码开关当前生效状态：开启时显示验证码并验证必填，关闭时不显示验证码相关内容
      let captchaEnabled = false;

      // 加载验证码：GET /captcha -> Result{success, code, msg, data:{captchaKey, captchaValue}}
      // captchaValue 为 base64 图片 data URI，直接作为 <img> 展示
      function loadCaptcha() {
        captchaKey = '';
        $('#captchaImg').hide();
        $.ajax({
          url: '/captcha',
          type: 'GET',
          dataType: 'json'
        }).done(function (res) {
          if (res.success && res.data) {
            captchaKey = res.data.captchaKey || '';
            $('#captchaImg').attr('src', res.data.captchaValue).show();
          } else {
            layer.msg(res.msg || '验证码加载失败', { icon: 2 });
          }
        }).fail(function (xhr) {
          layer.msg('验证码接口请求失败：' + xhr.status);
        });
      }

      // 点击图片刷新验证码
      $('#captchaBox').on('click', loadCaptcha);

      // 根据项目配置应用验证码开关：
      // 开启 -> 显示验证码行、输入框必填并加载验证码；关闭 -> 整行隐藏，不显示也不校验验证码
      function applyCaptchaConfig(enabled) {
        captchaEnabled = enabled;
        const $item = $('#captchaItem');
        const $input = $item.find('input[name="captcha"]');
        if (captchaEnabled) {
          $item.show();
          $input.attr('lay-verify', 'required');
          loadCaptcha();
        } else {
          $item.hide();
          $input.removeAttr('lay-verify');
        }
      }

      // MOCK_LOGIN = true：后端 /auth/login 尚未实现，表单校验通过后直接 mock 登录成功，
      // 写入本地登录态并跳转后台管理首页；后端登录接口实现后将其改为 false 即恢复走真实接口
      const MOCK_LOGIN = true;

      // 提交登录：POST /auth/login（后端实现后生效）
      form.on('submit(login-submit)', function (data) {
        if (MOCK_LOGIN) {
          // 构造与后端约定一致的登录返回体：data.accessToken + data.expiresIn（秒，-1 代表永不过期）
          const mockRes = {
            success: true,
            code: 200,
            msg: '登录成功',
            data: {
              accessToken: 'mock-' + Date.now() + '-' + Math.random().toString(36).slice(2),
              expiresIn: 7 * 24 * 60 * 60 // mock 默认 7 天；后端实现后以真实返回为准
            }
          };
          AdminAuth.saveAuth(mockRes.data, data.field.username);
          layer.msg('登录成功，正在跳转…', { icon: 1, time: 800 }, function () {
            location.href = '/admin/index.html';
          });
          return false; // 阻止表单默认提交
        }
        // 仅在验证码开启时携带验证码参数
        const payload = {
          username: data.field.username,
          password: data.field.password
        };
        if (captchaEnabled) {
          payload.captcha = data.field.captcha;
          payload.captchaKey = captchaKey;
        }
        $.ajax({
          url: '/auth/login',
          type: 'POST',
          contentType: 'application/json',
          data: JSON.stringify(payload),
          dataType: 'json'
        }).done(function (res) {
          if (res.success) {
            AdminAuth.saveAuth(res.data, data.field.username);
            layer.msg('登录成功，正在跳转…', { icon: 1, time: 800 }, function () {
              location.href = '/admin/index.html';
            });
          } else {
            layer.msg(res.msg || '登录失败', { icon: 2 });
            loadCaptcha();
          }
        }).fail(function (xhr) {
          // 登录接口尚未实现（404）或校验失败时的兜底提示
          let msg = '登录接口请求失败：' + xhr.status;
          try { if (xhr.responseJSON && xhr.responseJSON.msg) msg = xhr.responseJSON.msg; } catch (e) { /* 忽略解析失败 */ }
          layer.msg(msg, { icon: 2 });
          loadCaptcha();
        });
        return false; // 阻止表单默认提交
      });

      // 应用项目配置的验证码开关：mock 阶段读取 config.js 内置配置表，
      // 后端公开配置接口实现后 ProjectConfig 自动切换为真实数据（sys_config: captcha.enabled）
      ProjectConfig.isOn('captcha.enabled').then(applyCaptchaConfig);

      // 标语打字机效果：逐字显示，尾部光标闪烁；完成后光标停留 2s 再隐藏
      function typeSlogan(text) {
        const el = $('#brandSlogan').text('');
        let i = 0;
        el.addClass('typing');
        const timer = setInterval(function () {
          i += 1;
          el.text(text.slice(0, i));
          if (i >= text.length) {
            clearInterval(timer);
            setTimeout(function () { el.removeClass('typing'); }, 2000);
          }
        }, 80);
      }

      // 左屏品牌信息：站名/标语/双头像/恋爱计时，全部来自项目配置（mock 阶段读 config.js 内置表）
      ProjectConfig.load(['name', 'site.slogan', 'site.female-qq', 'site.male-qq', 'site.love-start-date']).then(function (config) {
        $('#brandName').text(config['name'] || 'Amour');
        // 标语以打字机效果逐字呈现（偏好减弱动效时直接显示完整文案）
        if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
          $('#brandSlogan').text(config['site.slogan'] || '');
        } else {
          typeSlogan(config['site.slogan'] || '');
        }
        // 双头像：配置 QQ 号 -> 前端拼接 qlogo 地址（s=640 为合法尺寸）；加载失败回退占位图，避免破图
        const avatarFallback = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104"><rect width="104" height="104" fill="#123a2e"/><text x="52" y="66" font-size="46" fill="#ff7a9e" text-anchor="middle" font-family="serif">\u2665</text></svg>');
        $('#brandFemaleAvatar')
          .on('error', function () { $(this).off('error').attr('src', avatarFallback); })
          .attr('src', ProjectConfig.qqAvatar(config['site.female-qq'], 640));
        $('#brandMaleAvatar')
          .on('error', function () { $(this).off('error').attr('src', avatarFallback); })
          .attr('src', ProjectConfig.qqAvatar(config['site.male-qq'], 640));
        // 恋爱计时：按 site.love-start-date 计算"已相爱 N 天"
        const start = new Date(String(config['site.love-start-date']).replace(' ', 'T'));
        if (!isNaN(start.getTime())) {
          const days = Math.max(0, Math.floor((Date.now() - start.getTime()) / 86400000));
          $('#brandDays').html('<svg class="brand-days-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> 我们已相爱 <span class="num">' + days + '</span> 天');
        }
      });
    });

    // 粒子心形：细小碎片从四散状态聚合为红色爱心，随节拍搏动；鼠标掠过时碎片轻轻避让
    (function () {
      const canvas = document.getElementById('heartCanvas');
      if (!canvas || !canvas.getContext) return;
      const ctx = canvas.getContext('2d');
      const SIZE = 400;                                    // 画布逻辑尺寸
      const dpr = window.devicePixelRatio || 1;
      canvas.width = SIZE * dpr;
      canvas.height = SIZE * dpr;
      ctx.scale(dpr, dpr);

      const COLORS = ['#ff4d6d', '#ff6b81', '#e63946', '#ff8fa3', '#d90429'];
      const COUNT = 500;                                   // 碎片数量
      const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      // 心形参数方程（数学系 y 向上，翻转并回正到画布中心）：x ∈ [-16,16]，y ∈ [-14.5,14.5]
      function heartXY(t) {
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        return { x: x, y: -y - 2.5 };
      }

      const cx = SIZE / 2, cy = SIZE / 2;
      const s = (SIZE * 0.74) / 32;                        // 心形宽度约占画布 74%
      const particles = [];
      for (let i = 0; i < COUNT; i++) {
        const t = Math.random() * Math.PI * 2;
        const p = heartXY(t);
        // 四成碎片贴住轮廓勾勒边缘，其余按面积均匀分布向内填充，直达心形中心不再空洞
        const shell = Math.random() < 0.4 ? 1 : Math.sqrt(Math.random());
        particles.push({
          tx: cx + p.x * s * shell,
          ty: cy + p.y * s * shell,
          x: Math.random() * SIZE,
          y: Math.random() * SIZE,
          size: 1.1 + Math.random() * 2.2,
          color: COLORS[i % COLORS.length],
          phase: Math.random() * Math.PI * 2,
          ease: 0.025 + Math.random() * 0.05
        });
      }

      const mouse = { x: 0, y: 0, on: false };
      canvas.addEventListener('mousemove', function (e) {
        const rect = canvas.getBoundingClientRect();
        mouse.x = (e.clientX - rect.left) * (SIZE / rect.width);
        mouse.y = (e.clientY - rect.top) * (SIZE / rect.height);
        mouse.on = true;
      });
      canvas.addEventListener('mouseleave', function () { mouse.on = false; });

      let pulse = 0, lastBeat = 0;

      function draw(now) {
        ctx.clearRect(0, 0, SIZE, SIZE);
        // 节拍：每 1.6s 触发一次搏动，碎片沿离心方向弹开后回聚
        if (now - lastBeat > 1600) { pulse = 1; lastBeat = now; }
        pulse += (0 - pulse) * 0.08;
        const k = 1 + pulse * 0.16;
        for (let i = 0; i < particles.length; i++) {
          const pt = particles[i];
          pt.x += (cx + (pt.tx - cx) * k - pt.x) * pt.ease;
          pt.y += (cy + (pt.ty - cy) * k - pt.y) * pt.ease;
          const jx = Math.sin(now / 900 + pt.phase) * 1.2;   // 微幅呼吸，避免画面呆板
          const jy = Math.cos(now / 850 + pt.phase) * 1.2;
          let ox = 0, oy = 0;
          if (mouse.on) {
            const dx = pt.x - mouse.x, dy = pt.y - mouse.y;
            const d2 = dx * dx + dy * dy;
            if (d2 < 3600 && d2 > 0.01) {                    // 半径 60 内的碎片被鼠标轻轻推开
              const d = Math.sqrt(d2);
              const f = ((60 - d) / 60) * 14;
              ox = (dx / d) * f;
              oy = (dy / d) * f;
            }
          }
          ctx.fillStyle = pt.color;
          ctx.fillRect(pt.x + jx + ox - pt.size / 2, pt.y + jy + oy - pt.size / 2, pt.size, pt.size);
        }
      }

      if (reduced) {
        // 降低动效偏好：静态绘制一次聚合完成的心形
        for (const pt of particles) { pt.x = pt.tx; pt.y = pt.ty; }
        draw(0);
      } else {
        requestAnimationFrame(function loop(now) { draw(now); requestAnimationFrame(loop); });
      }
    })();
  </script>
</body>
</html>
