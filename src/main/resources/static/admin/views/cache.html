<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>缓存管理</title>
  <link rel="shortcut icon" href="/assets/portal/img/favicon.ico">
  <link rel="stylesheet" href="/assets/layui/2.13.9/css/layui.css">
</head>
<body style="padding: 14px;">
  <div class="layui-card">
    <div class="layui-card-header">缓存管理（占位页）</div>
    <div class="layui-card-body">
      <table id="cacheTable" lay-filter="cache-table"></table>
    </div>
  </div>

  <script src="/assets/layui/2.13.9/layui.js"></script>
  <script>
    layui.use(['table', 'layer'], function () {
      const table = layui.table;

      // 占位数据：后端缓存管理接口实现后，替换为 url 方式加载
      table.render({
        elem: '#cacheTable',
        defaultToolbar: [],
        cols: [[
          { field: 'name', title: '缓存名称', width: 220 },
          { field: 'expireAfterWrite', title: '写入后过期（秒）', width: 180 },
          { field: 'expireAfterAccess', title: '访问后过期（秒）', width: 180 },
          { field: 'size', title: '当前条目数' }
        ]],
        data: [
          { name: 'captcha', expireAfterWrite: 300, expireAfterAccess: 0, size: 0 },
          { name: 'config', expireAfterWrite: 0, expireAfterAccess: 0, size: 0 }
        ],
        page: false,
        skin: 'line'
      });
    });
  </script>
</body>
</html>
