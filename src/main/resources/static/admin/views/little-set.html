<script>
    (function () {
        'use strict';

        var auth = AdminAuth.getAuth();

        // 顶栏与侧栏展示当前登录用户名
        $('.js-username').text(auth && auth.username ? auth.username : 'Admin');

        // 站点名称：浏览器标签 + 顶栏 Logo + 侧栏用户名均取自站点配置 name
        ProjectConfig.get('name').then(function (name) {
            if (!name) return;
            document.title = name + ' - 点点滴滴';
            $('.js-site-name').text(name);
        });

        // 用户头像：站点配置的男主 QQ -> QQ 头像；加载失败回退占位图，避免破图
        ProjectConfig.get('site.male-qq').then(function (qq) {
            var fallback = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104"><rect width="104" height="104" fill="#ff5295"/><text x="52" y="66" font-size="46" fill="#fff" text-anchor="middle" font-family="serif">\u2665</text></svg>');
            $('.js-user-avatar')
                .on('error', function () { $(this).off('error').attr('src', fallback); })
                .attr('src', ProjectConfig.qqAvatar(qq, 640));
        });

        // 退出登录：清除本地登录态并回到登录页
        $('.js-logout').on('click', function () {
            AdminAuth.clearAuth();
            location.href = '/admin/login.html';
        });
    })();
</script>
