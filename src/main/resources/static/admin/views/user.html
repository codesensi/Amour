<script>
    // 原站遗留的账号/密码格式校验函数，按原样保留（表单未绑定 onsubmit，不会自动触发）
    function check() {
        let adminName = document.getElementsByName('adminName')[0].value.trim();
        let pw = document.getElementsByName('pw')[0].value.trim();
        // 判断adminName长度是否为0 如果为0则提示弹窗
        if (adminName.length == 0) {
            alert("请填写用户名");
            return false;
        }
        let user = /[a-zA-Z0-9]/g;
        let character = new RegExp("[`~!#$^&*()=|{}':;',\\[\\].<>/?~！#￥……&*（）——|{}【】‘；：”“'。，、？]");
        if (character.test(adminName)) {
            alert("用户名含有特殊字符 本次修改已拦截")
            return false;
        } else if (!(user.test(adminName))) {
            alert("用户名只支持数字与英文大小写字母")
            return false;
        }
        if (pw.length >= 1) {
            if (pw.length <= 6) {
                alert("密码长度需大于六位数")
                return false;
            }
            if (character.test(pw)) {
                alert("密码含有特殊字符为了过滤SQL注入已拦截\n请输入大小写字母与数字组成的密码")
                return false;
            }
        }
    }

                '<svg xmlns="http://www.w3.org/2000/svg" width="104" height="104"><rect width="104" height="104" fill="#ff5295"/><text x="52" y="66" font-size="46" fill="#fff" text-anchor="middle" font-family="serif">\u2665</text></svg>');
            $('.js-user-avatar')
                .on('error', function () { $(this).off('error').attr('src', fallback); })
                .attr('src', ProjectConfig.qqAvatar(qq, 640));
        });

        // 退出登录：清除本地登录态并回到登录页
        $('.js-logout').on('click', function () {
            AdminAuth.clearAuth();
            location.href = '/admin/login.html';
        });
    })();
</script>
