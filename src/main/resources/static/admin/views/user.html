<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="utf-8"/>
    <title>全局设置</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="A fully featured admin theme which can be used to build CRM, CMS, etc." name="description"/>
    <meta content="Coderthemes" name="author"/>
    <!-- 登录态守卫：未登录则跳转登录页（在渲染前同步执行，避免闪屏） -->
    <script src="/admin/js/guard.js"></script>
    <!-- App css -->
    <link href="/assets/admin/css/loading.css" rel="stylesheet">
</head>

<body>

<div id="loading-mask">
    <div id="loading-layer">
        <div id="loading-spinner">
            <div class="loading-ring" id="loading-ring-4"></div>
            <div class="loading-ring" id="loading-ring-3"></div>
            <div class="loading-ring" id="loading-ring-2"></div>
            <div class="loading-ring" id="loading-ring-1"></div>
        </div>
    </div>
</div><!--内容页面 Start-->
        <div class="content-page">
            <!--内容 Start-->
            <div class="content">

                <!-- 页面特有样式：照搬原站 user.php 内容区样式，追加在全站样式之后 -->

                <div class="layui-row">

                    <div class="layui-col-md12">
                        <div class="layui-card">
                            <div class="layui-card-body">
                                <h4 class="header-title mb-3">信息配置</h4>

                                <!-- 原站表单提交至 userPost.php，提交已改为页面脚本 mock 处理，此处移除 action/method -->
                                <form class="needs-validation layui-form" novalidate>
                                    <div class="form-group">
                                        <label>是否开启前端加载动画</label>
                                        <select class="layui-select" name="Webanimation">
                                            <option value="1" selected>开启</option>
                                            <option value="2">关闭</option>
                                        </select>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label>管理员姓名</label>
                                        <input type="text" class="layui-input" placeholder="请输入管理员Name"
                                               name="userName" value="龙猫汪汪汪" required>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label>管理员QQ</label>
                                        <input type="text" class="layui-input" placeholder="请输入管理员QQ"
                                               name="userQQ" value="2623669948" required>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label>管理员登录账号</label>
                                        <span class="layui-badge layui-bg-green">账号由大小写字母与数字组成</span>
                                        <input type="text" class="layui-input" placeholder="请输入需修改的管理员账号"
                                               name="adminName" value="codesensi" required>

                                    </div>
                                    <div class="form-group mb-3">
                                        <label>管理员登录密码</label>
                                        <span class="layui-badge layui-bg-green">密码由大小写字母与数字组成</span>
                                        <input class="layui-input" name="pw" type="password" value="" placeholder="不修改请留空">
                                    </div>

                                    <div class="form-group mb-3">
                                        <label>自定义前端全局CSS样式
                                            <span class="layui-badge layui-bg-blue">请按CSS格式填写你的代码</span></label>
                                        <textarea name="cssCon" class="layui-textarea" rows="5"
                                                  placeholder=""></textarea>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label>自定义头部标签
                                            <span class="layui-badge layui-bg-blue">可填写HTML标签 CSS外链</span></label>
                                        <textarea name="headCon" class="layui-textarea" rows="5"
                                                  placeholder=""></textarea>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label>自定义底部标签
                                            <span class="layui-badge layui-bg-blue">可填写HTML标签 js外链</span></label>
                                        <textarea name="footerCon" class="layui-textarea" rows="5"
                                                  placeholder="">&lt;!--&lt;script src=&quot;https://img-love.kikiw.cn/jsxg/yh/yinghua.js&quot;&gt;&lt;/script&gt;--&gt;</textarea>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label>安全码</label>
                                        <span class="layui-badge layui-bg-red">修改敏感信息必须填写</span>
                                        <input type="password" class="layui-input" name="SCode" value="" placeholder="请输入安全码">
                                    </div>

                                    <div class="form-group mb-3">
                                        <button class="layui-btn" type="button" id="userPost">提交修改</button>
                                    </div>
                                </form>

                            </div> <!-- end card-body-->
                        </div> <!-- end card-->
                    </div> <!-- end col-->


                </div>

            </div>

            <!-- content End -->


</div>

<!-- content-page -->

</div>

</div>
<!-- App js -->

<!-- 后台 ESM 入口：登录校验、外壳初始化、pjax 与页面模块调度 -->

</body>

</html>
